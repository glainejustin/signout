name: Release APK

# Fires when a version tag is pushed (v1.0.0, v1.1.0, …) and builds an installable
# Android APK for testers, attaching it to that tag's GitHub release.
# Can also be run by hand from the Actions tab for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the APK to (e.g. v1.1.0)'
        required: true

# Needed to create/update the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    # The keystore is written to $RUNNER_TEMP, never to the workspace: it must not end up
    # in an artifact, a cache, or the checked-out tree.
    steps:
      # On a tag push both resolve to the tag; on a manual run this checks out the
      # tag you named (not `main`), so the APK matches the release it's attached to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: rel
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A Play-uploadable AAB must be signed with the upload key, and that key can only come
      # from a repository secret — the workflow will never invent one, because a keystore
      # generated per run would produce an app nobody can update. Without the secret the
      # job still ships the debug APK, but says so loudly instead of quietly attaching an
      # unsigned AAB that Play would reject.
      - name: Detect signing credentials
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials present — building a signed AAB and release APK."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this release gets the debug APK only (no Play-uploadable AAB)."
            echo "::warning::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD — see README → Signed release builds."
          fi

      # Guard rail: this workflow always runs from the default branch but builds the
      # *tagged* tree, so a tag cut before the staging script existed can't be built
      # (its `webDir: "."` would also embed the whole repo in the APK). Fail loudly
      # with an actionable message instead of a confusing "Missing script: build".
      - name: Preflight — tagged tree is buildable
        run: |
          if [ ! -f scripts/build-web.mjs ]; then
            echo "::error::${{ steps.rel.outputs.tag }} predates the APK pipeline (no scripts/build-web.mjs)."
            echo "::error::Tag a commit that includes it (e.g. the tip of main) instead of re-building an older tag."
            exit 1
          fi
          node -e "const s=JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts||{}; if(!s.build){console.error('::error::package.json has no build script');process.exit(1)}"
          # Only fatal when signing is actually configured: a tag cut before the signing
          # script existed can still produce a debug APK, it just cannot be signed.
          if [ "${{ steps.signing.outputs.configured }}" = "true" ] && [ ! -f scripts/configure-android-signing.mjs ]; then
            echo "::error::${{ steps.rel.outputs.tag }} predates the release-signing script, so it cannot be signed."
            echo "::error::Tag a commit that includes it (e.g. the tip of main) instead of re-building an older tag."
            exit 1
          fi
          echo "✅ ${{ steps.rel.outputs.tag }} contains the build pipeline"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.x need JDK 21.
      # The ubuntu-latest image ships the Android SDK (ANDROID_HOME/ANDROID_SDK_ROOT),
      # so no extra SDK setup or licence acceptance is required.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # compileSdkVersion is 36 (see android/variables.gradle once generated), which is
      # newer than some runner images ship. Best-effort pre-install; AGP auto-downloads
      # anything still missing, so this never fails the release.
      - name: Ensure Android SDK platform is present
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 \
              || echo "::notice::sdkmanager could not pre-install — Gradle will auto-download if needed"
          else
            echo "::notice::sdkmanager not on PATH — relying on the runner image / Gradle auto-download"
          fi

      - name: Install dependencies
        run: npm ci

      # Never ship an APK built from a failing commit.
      - name: Unit tests
        run: npm test

      # Stages the web app into dist/ (webDir in capacitor.config.json).
      - name: Stage web assets
        run: npm run build

      # android/ is generated in CI (git-ignored) rather than committed, so the
      # APK always matches the pinned @capacitor/android version.
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      # `cap add android` writes Capacitor's stock icons and splash; this replaces them
      # with the SignOut mark (launcher, round, adaptive foreground + splash, all
      # density buckets) and sets the adaptive background colour.
      - name: Brand the app icons
        run: npm run icons -- --android

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # The icons step can run and the binary still ship the wrong artwork — that is
      # how the pre-rebrand "WT" icon reached a published release. This opens the APK,
      # decodes its launcher icons and splash screens and compares them pixel-by-pixel
      # against the generated images, so a stale or template icon fails the release
      # here — before anything is named, uploaded or attached to a release.
      - name: Verify the APK ships the branded artwork
        run: npm run verify:apk

      # ── Signed release artifacts (Play) ──────────────────────────────────────

      - name: Decode the signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE" || { echo "::error::the decoded keystore is empty — is ANDROID_KEYSTORE_BASE64 set correctly?"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "keystore decoded to \$RUNNER_TEMP/upload.jks ($(wc -c < "$KEYSTORE") bytes)"

      # Patches the generated app/build.gradle: a signingConfig reading the credentials
      # from the environment, the release build type wired to it, and versionCode /
      # versionName taken from the tag (Play permanently rejects a re-used version code,
      # and Capacitor's template hardcodes versionCode 1).
      - name: Configure release signing
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs "${{ steps.rel.outputs.tag }}"

      # The credentials are passed to this step explicitly rather than exported via
      # $GITHUB_ENV: Gradle reads them from the environment (`System.getenv` in the patched
      # build.gradle), and a step-level `env:` does not carry over to later steps — so
      # exporting only the keystore *path* and relying on the secrets from the configure
      # step would hand Gradle null passwords and fail at signing time, on a real tag.
      # Scoping them here also keeps the secrets out of every other step's environment.
      - name: Build signed AAB and release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # "It built" is not "it is signed": prove the signature, because an unsigned AAB is
      # only rejected at the Play upload console, long after the release went out.
      - name: Verify the signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$AAB" || { echo "::error::no AAB produced at $AAB"; exit 1; }
          test -f "$APK" || { echo "::error::no release APK produced at $APK"; exit 1; }

          # An AAB is a signed JAR, so it must carry a signature entry.
          SIG=$(unzip -l "$AAB" | grep -oE 'META-INF/[^ ]+\.(RSA|DSA|EC)' | head -1 || true)
          test -n "$SIG" || { echo "::error::the AAB carries no META-INF signature — Play would reject it"; exit 1; }
          echo "AAB signature entry: $SIG"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" || { echo "::error::neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"; exit 1; }
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in $SDK/build-tools"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      # The signed build is a different Gradle variant, so the artwork has to be proven
      # here too rather than inferred from the debug build.
      - name: Verify the release APK ships the branded artwork
        if: steps.signing.outputs.configured == 'true'
        run: node scripts/verify-apk-branding.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: Name and checksum the signed artifacts
        id: signed
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          AAB="signout-${TAG}.aab"
          APK="signout-${TAG}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$AAB" > "$AAB.sha256"
          sha256sum "$APK" > "$APK.sha256"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$AAB" "$APK"

      - name: Name the APK after the tag and checksum it
        id: apk
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          APK="signout-${TAG}.apk"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC" || { echo "::error::APK not produced at $SRC"; exit 1; }

          # Versioned copy — this is the one to reference in bug reports.
          cp "$SRC" "$APK"
          sha256sum "$APK" > "$APK.sha256"

          # Stable alias so `releases/latest/download/signout-latest.apk` (linked from
          # the README) keeps working without being repointed every release. The
          # checksum is regenerated from the alias so its filename matches.
          cp "$SRC" signout-latest.apk
          sha256sum signout-latest.apk > signout-latest.apk.sha256

          echo "file=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK" signout-latest.apk

      # Available even if the release upload is skipped or fails.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: signout-apk-${{ steps.rel.outputs.tag }}
          if-no-files-found: error
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
            signout-latest.apk
            signout-latest.apk.sha256

      - name: Upload signed artifacts
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: signout-signed-${{ steps.rel.outputs.tag }}
          if-no-files-found: error
          path: |
            ${{ steps.signed.outputs.aab }}
            ${{ steps.signed.outputs.aab }}.sha256
            ${{ steps.signed.outputs.apk }}
            ${{ steps.signed.outputs.apk }}.sha256

      # A tag with no release yet still gets one, documented with that version's
      # CHANGELOG section (falling back to GitHub's generated notes if the version
      # has no section). Never rewrites notes on a release that already exists.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes untouched"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=$(awk -v v="## [$VERSION]" 'index($0, v) == 1 { f = 1 } /^## \[/ && index($0, v) != 1 { f = 0 } f' CHANGELOG.md)
          if [ -n "$NOTES" ]; then
            echo "creating $TAG from the CHANGELOG section"
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          else
            echo "::warning::no CHANGELOG section for $VERSION — using generated notes"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            signout-latest.apk signout-latest.apk.sha256 \
            --clobber

      - name: Attach the signed artifacts to the release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.signed.outputs.aab }}" "${{ steps.signed.outputs.aab }}.sha256" \
            "${{ steps.signed.outputs.apk }}" "${{ steps.signed.outputs.apk }}.sha256" \
            --clobber

      # Best-effort, and always: the runner is ephemeral, but the workspace persists for the
      # remaining steps and the key should not outlive the build that needed it.
      - name: Remove the keystore
        if: always() && steps.signing.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks" && echo "keystore removed"

      - name: Summary
        run: |
          {
            echo "### 📦 ${{ steps.rel.outputs.tag }}"
            echo ""
            echo "APK: \`${{ steps.apk.outputs.file }}\`"
            echo ""
            echo "Stable link: <https://github.com/${{ github.repository }}/releases/latest/download/signout-latest.apk>"
            echo ""
            echo '```'
            cat "${{ steps.apk.outputs.file }}.sha256"
            echo '```'
            echo ""
            echo "Install with \`adb install -r ${{ steps.apk.outputs.file }}\` or by opening the file on the device."
            echo ""
            echo "Artwork verified: all 26 branded images (icons + splash) match the generated design."
            echo ""
            if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
              echo "#### Signed artifacts (Play)\n"
              echo "| Artifact | Purpose |"
              echo "|---|---|"
              echo "| \`${{ steps.signed.outputs.aab }}\` | Play Store upload (signed AAB) |"
              echo "| \`${{ steps.signed.outputs.apk }}\` | Signed release APK for testers |"
              echo ""
              echo '```'
              cat "${{ steps.signed.outputs.aab }}.sha256" "${{ steps.signed.outputs.apk }}.sha256"
              echo '```'
            else
              echo "#### ⚠️ No signed build\n"
              echo "The signing secrets are not configured, so this release has **no Play-uploadable AAB**."
              echo "Add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\` and \`ANDROID_KEY_PASSWORD\` (see README → Signed release builds)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
