name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Reads each pinned action's own action.yml at its pinned ref and fails on an action
      # whose `runs.using` is behind CURRENT_NODE — the Node 20 deprecation that needed a
      # coordinated bump of eight actions, caught one reference at a time from now on.
      # Needs no install and no token (raw.githubusercontent, with the contents API as a
      # fallback for private actions), so it can run before anything else.
      - name: Action runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:actions

      - name: Install
        run: npm ci

      - name: Check required files
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f manifest.json || (echo "manifest.json missing" && exit 1)
          test -f service-worker.js || (echo "service-worker.js missing" && exit 1)
          test -f capacitor.config.json || (echo "capacitor.config.json missing" && exit 1)
          test -d js || (echo "js/ missing" && exit 1)
          test -d css || (echo "css/ missing" && exit 1)
          echo "✅ All required PWA files present"

      - name: Unit tests
        run: npm test

      # The same command contributors run before tagging, minus the APK stages (no JDK or
      # Android SDK on this runner — the release workflow builds those). It re-runs the
      # suite, which costs a second, and adds what nothing else checked here: that
      # `npm run build` stages the real payload and that dist/ contains no leakage.
      - name: Release gate (fast path)
        run: npm run release:check -- --no-android

      - name: HTMLHint
        run: npx --yes htmlhint index.html || true

      - name: Sync check (Capacitor)
        run: npx cap sync --help >/dev/null 2>&1 && echo "Capacitor OK" || echo "Capacitor check skipped"
